services:
  # Backend API
  - type: web
    name: trip-tracker-api
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trip-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false  # Set to your frontend URL after first deploy
      - key: REDIS_URL
        sync: false  # Optional: add Redis later for multi-instance

  # Frontend
  - type: web
    name: trip-tracker-frontend
    runtime: node
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Set to backend URL after deploy (e.g. https://trip-tracker-api.onrender.com)
      - key: NEXT_PUBLIC_WS_URL
        sync: false  # Set to wss://your-backend-url.onrender.com

  # PostgreSQL Database
  - type: pgsql
    name: trip-tracker-db
    plan: starter
    databaseName: trip_tracker
    ipAllowList: []
