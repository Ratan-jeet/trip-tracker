services:
  # Backend API
  - type: web
    name: trip-tracker-api
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trip-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://trip-tracker-app.onrender.com

  # Frontend
  - type: web
    name: trip-tracker-app
    runtime: node
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false

  # PostgreSQL Database
  - type: pgsql
    name: trip-tracker-db
    plan: starter
    databaseName: trip_tracker
    ipAllowList: []
