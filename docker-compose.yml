# Local development services. The API and web app run on the host via `npm run dev`;
# this file provides the backing services they talk to.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: trip_together
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trip_together']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Required only when running more than one API instance: live positions and
    # WebSocket fan-out are per-process without it.
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
